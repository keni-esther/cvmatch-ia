[phases.setup]
# On force l'installation de PHP ET de Python
pkgs = ["php", "python3", "python3-pip", "poppler-utils", "default-libmysqlclient-dev"]

[phases.install]
# On installe les dépendances Python
cmds = ["pip install -r requirements.txt"]

[start]
# On lance votre fichier Python (modifiez app.py par votre nom de fichier)
cmd = "python3 app.py"
